---
name: Ansible Lint

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv from PyPI
        run: python -m pip install uv==0.13.7

      - name: Install yq for regression checks
        run: |
          go install github.com/mikefarah/yq/v4@v4.54.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run pre-push checks
        run: ./scripts/check.sh
