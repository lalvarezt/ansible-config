---
# Chezmoi initialization and application (FINAL CONFIG)

- name: Check if chezmoi is installed
  ansible.builtin.command: which chezmoi
  register: chezmoi_check
  failed_when: false
  changed_when: false
  environment:
    PATH: "{{ ansible_path }}"

- name: Install chezmoi via Homebrew (if not present)
  ansible.builtin.command: "{{ brew_bin }} install --quiet chezmoi"
  environment:
    PATH: "{{ ansible_path }}"
  when: chezmoi_check.rc != 0
  changed_when: true

- name: Check if chezmoi is already initialized
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/chezmoi/.git"
  register: chezmoi_init_check

- name: Record whether chezmoi was initialized during this run
  ansible.builtin.set_fact:
    chezmoi_initialized_this_run: "{{ not chezmoi_init_check.stat.exists }}"

- name: Initialize chezmoi with SSH
  ansible.builtin.command: chezmoi init {{ chezmoi_repo_url }}
  when:
    - not chezmoi_init_check.stat.exists
    - not (is_wsl | default(false))
  environment:
    PATH: "{{ ansible_path }}"
  changed_when: true

- name: Initialize chezmoi on WSL before its persistent SSH bridge exists
  when:
    - not chezmoi_init_check.stat.exists
    - is_wsl | default(false)
  block:
    - name: Create a private directory for the bootstrap SSH socket
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible-chezmoi-agent-
      register: chezmoi_agent_directory

    - name: Clone dotfiles through a temporary Windows SSH agent bridge
      ansible.builtin.shell: |
        socat "UNIX-LISTEN:$BOOTSTRAP_AGENT_SOCKET,fork,mode=0600" \
          "EXEC:$BOOTSTRAP_NPIPERELAY -ei -s //./pipe/openssh-ssh-agent,nofork" &
        relay_pid=$!
        trap 'kill "$relay_pid" 2>/dev/null; wait "$relay_pid" 2>/dev/null' EXIT
        attempt=0
        while [ ! -S "$BOOTSTRAP_AGENT_SOCKET" ]; do
          attempt=$((attempt + 1))
          if [ "$attempt" -ge 50 ] || ! kill -0 "$relay_pid" 2>/dev/null; then
            echo "Temporary SSH agent bridge did not start" >&2
            exit 1
          fi
          sleep 0.1
        done
        SSH_AUTH_SOCK="$BOOTSTRAP_AGENT_SOCKET" chezmoi init "$BOOTSTRAP_CHEZMOI_REPO"
      environment:
        PATH: "{{ ansible_path }}"
        BOOTSTRAP_AGENT_SOCKET: "{{ chezmoi_agent_directory.path }}/agent.sock"
        BOOTSTRAP_NPIPERELAY: "{{ npiperelay_path | quote }}"
        BOOTSTRAP_CHEZMOI_REPO: "{{ chezmoi_repo_url }}"
      changed_when: true
      when: not ansible_check_mode
  always:
    - name: Remove the temporary SSH agent directory
      ansible.builtin.file:
        path: "{{ chezmoi_agent_directory.path }}"
        state: absent
      when: chezmoi_agent_directory.path is defined

- name: Apply chezmoi configuration (FINAL CONFIG - overrides temp env)
  ansible.builtin.command: chezmoi apply
  environment:
    PATH: "{{ ansible_path }}"
  changed_when: true

- name: Display chezmoi completion message
  ansible.builtin.debug:
    msg: >-
      Chezmoi has {{ 'been initialized and ' if chezmoi_initialized_this_run else '' }}applied
      the current configuration.
