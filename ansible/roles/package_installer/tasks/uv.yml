---
# Install packages via UV (batch loop)

- name: Install packages via UV
  ansible.builtin.command: "{{ uv_bin }} {{ item.command }}"
  environment:
    PATH: "{{ ansible_path }}"
  loop: "{{ uv_packages }}"
  loop_control:
    label: "{{ item.name }}"
  register: uv_result
  changed_when:
    - uv_result.rc == 0
    - "'is already installed' not in uv_result.stderr"
